name: CI

on:
  # Only by hand, from the Actions tab (the owner, 2026-10-07: pre-alpha, development speed
  # first, no tags). Pushes and pull requests start nothing.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Pinned, and moved on purpose: a new stable's lints must not turn a green tree red
      # overnight under `-D warnings`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
